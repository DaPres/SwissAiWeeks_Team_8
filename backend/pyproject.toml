[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "azure-identity>=1.25.3",
    "fastapi>=0.141.1",
    "numpy>=2.5.3",
    "openai>=3.19.2",
    "python-dotenv>=1.2.3",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
