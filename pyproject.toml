[project]
name = "swiss-life-support-agent"
version = "0.1.0"
description = "AI support agent for operational service desks (Swiss {ai} Weeks, Swiss Life challenge)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.7.0",
    "chromadb>=1.5.9",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "openai>=3.17.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.1.0",
    "streamlit>=1.64.0",
    "tenacity>=9.1.4",
    "uvicorn>=0.53.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
